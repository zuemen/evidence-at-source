name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Two pushes in quick succession used to collide: the second deployment is
# rejected outright while the first is still in flight, turning a green test
# run into a red workflow for a reason that has nothing to do with the code.
# Queueing is right rather than cancelling — the newer commit should still be
# published, just after the older one finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # `attestations: write` stores the provenance statement; `id-token: write`
    # is what lets the runner prove to Sigstore that it is this workflow, on
    # this commit, in this repository. Without the second one the first signs
    # nothing anybody should believe.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      # The judge-facing demo is a gate: exit code 0 means every claim holds.
      - run: npm run demo:vlei
      - name: Build static demo
        run: npm run build --workspace @eas/web
      # Every other check here runs in Node, which is how a browser-only crash
      # shipped and stayed live. This one loads the built site for real.
      - name: Install Chromium for the browser gate
        run: npx playwright install --with-deps chromium
      - run: npm run smoke:web
      # Build provenance — the one layer of GLEIF's Workload pillar a static
      # site can actually supply. It binds every file we publish to this commit
      # and this workflow run, so a reader can check that the code running in
      # their browser is the code in this repository rather than taking our
      # word for it. See the "Workload 支柱" section of README.md for the four
      # layers this does *not* provide.
      #
      # Only on main: a pull request from a fork cannot mint an attestation,
      # and a step that fails there would be noise rather than a signal.
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'packages/web/dist/**/*'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: packages/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
